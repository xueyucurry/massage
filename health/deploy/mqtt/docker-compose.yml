services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: health-band-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./acl:/mosquitto/config/acl:ro
      - ./passwords:/mosquitto/config/passwords:ro
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
